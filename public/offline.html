<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ec4899">
    <title>Sedang Offline - Gym Tracker by Neil</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #fdf2f8, #fbcfe8); font-family: system-ui, sans-serif; color: #3b1d2f; text-align: center; padding: 24px; }
        .box { background: #fff; border-radius: 28px; padding: 32px 24px; max-width: 380px; box-shadow: 0 20px 50px rgba(236,72,153,.2); }
        .emoji { font-size: 3rem; }
        h1 { font-size: 1.25rem; margin: 12px 0 8px; }
        p { color: #9d6b86; font-size: .9rem; line-height: 1.5; margin: 0 0 20px; }
        button { background: #ec4899; color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">🌸</div>
        <h1>Koneksi internet terputus</h1>
        <p>Data jadwal dan sesi selalu diambil langsung dari server supaya akurat, jadi aplikasi butuh internet. Cek koneksimu lalu coba lagi ya.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
